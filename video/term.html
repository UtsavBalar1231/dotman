<!doctype html>
<meta charset="utf-8">
<style>@font-face{font-family:"Departure Mono";src:url(fonts/departure-mono.woff) format("woff")}
html,body{margin:0;background:#faf8f4}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// Replays an asciicast v2 recording in a terminal window on a flat canvas, with the prepare/renderFrame
// contract render.mjs drives. Only the escape sequences dotman, git and bash print are interpreted: SGR,
// erase, cursor moves, cursor visibility; OSC strings are dropped.
// Departure Mono is a pixel font on an 11-pixel em: sizes that are multiples of 11 on integer baselines
// keep its pixels sharp, and bold is the glyph drawn again one pixel to the right, because the font has
// one weight and a synthesized bold smears the grid.
const spec = window.CLIP_SPEC;
const lines = spec.cast.trim().split('\n');
const header = JSON.parse(lines[0]);
const events = lines.slice(1).map(l => JSON.parse(l)).filter(e => e[1] === 'o');
const COLS = header.width, ROWS = header.height;
const FONT = '"Departure Mono", monospace';
const W = spec.window, SIZE = W.size, ADV = W.advance, PITCH = W.pitch;
const TX = W.x + W.inset;
// Caps are 8/11 em and descenders 2/11, so this centres the ink in the row.
const BASE = (PITCH + SIZE * 6 / 11) / 2;
const BG = '#161616', FG = '#ececec', DIM = '#939393';
const PALETTE = [DIM, '#e5534b', '#45ae5c', '#d8a640', '#6ea8fe', '#c58af9', '#56c2c9', FG];
// A close-up frames the window as the reference close-ups do: its left edge at CLOSE_EDGE, the key row at
// CLOSE_ROW, its top and title bar cut off, and its bottom edge no higher than CLOSE_BOTTOM. Its scale must turn the 3 px font
// pixels at 33 px into whole pixels: 4/3 or 2.
const CLOSE_EDGE = 175, CLOSE_ROW = 480, CLOSE_BOTTOM = 950;

const canvas = document.getElementById('c');
canvas.width = spec.width; canvas.height = spec.height;
const g = canvas.getContext('2d');
window.__canvas = canvas;

function xterm256(n) {
  if (n < 16) return PALETTE[n % 8];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  n -= 16;
  const c = [Math.floor(n / 36), Math.floor(n / 6) % 6, n % 6].map(v => (v ? 55 + v * 40 : 0));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

class Screen {
  constructor() { this.reset(); }
  reset() {
    this.grid = Array.from({ length: ROWS }, () => this.blankRow());
    this.r = 0; this.c = 0; this.attr = {}; this.cursor = true;
    this.mode = 'text'; this.params = ''; this.next = 0; this.lastOut = 0; this.main = null;
  }
  blankRow() { return Array.from({ length: COLS }, () => ({ ch: ' ', a: {} })); }
  text(r) { return this.grid[r].map(cell => cell.ch).join(''); }
  newline() {
    if (this.r === ROWS - 1) { this.grid.shift(); this.grid.push(this.blankRow()); } else this.r++;
  }
  put(ch) {
    if (this.c >= COLS) { this.c = 0; this.newline(); }
    this.grid[this.r][this.c] = { ch, a: this.attr };
    this.c++;
  }
  sgr(list) {
    const p = list.length ? list : [0];
    const a = { ...this.attr };
    for (let i = 0; i < p.length; i++) {
      const n = p[i];
      if (n === 0) { for (const k of Object.keys(a)) delete a[k]; }
      else if (n === 1) a.bold = true;
      else if (n === 2) a.dim = true;
      else if (n === 22) { a.bold = false; a.dim = false; }
      else if (n === 7) a.inverse = true;
      else if (n === 27) a.inverse = false;
      else if (n >= 30 && n <= 37) a.fg = PALETTE[n - 30];
      else if (n >= 90 && n <= 97) a.fg = PALETTE[n - 90];
      else if (n === 39) delete a.fg;
      else if (n >= 40 && n <= 47) a.bg = PALETTE[n - 40];
      else if (n === 49) delete a.bg;
      else if ((n === 38 || n === 48) && p[i + 1] === 5) { a[n === 38 ? 'fg' : 'bg'] = xterm256(p[i + 2]); i += 2; }
      else if ((n === 38 || n === 48) && p[i + 1] === 2) { a[n === 38 ? 'fg' : 'bg'] = `rgb(${p[i + 2]},${p[i + 3]},${p[i + 4]})`; i += 4; }
    }
    this.attr = a;
  }
  csi(final) {
    const priv = this.params.startsWith('?');
    const p = this.params.replace('?', '').split(';').filter(s => s !== '').map(Number);
    const n = p[0] || 1;
    switch (final) {
      case 'm': this.sgr(p); break;
      case 'K': {
        const row = this.grid[this.r], mode = p[0] || 0;
        const [from, to] = mode === 0 ? [this.c, COLS] : mode === 1 ? [0, this.c + 1] : [0, COLS];
        for (let i = from; i < Math.min(to, COLS); i++) row[i] = { ch: ' ', a: {} };
        break;
      }
      case 'J':
        if ((p[0] || 0) === 2) this.grid = Array.from({ length: ROWS }, () => this.blankRow());
        else if (!p[0]) {
          for (let i = this.c; i < COLS; i++) this.grid[this.r][i] = { ch: ' ', a: {} };
          for (let r = this.r + 1; r < ROWS; r++) this.grid[r] = this.blankRow();
        }
        break;
      case 'A': this.r = Math.max(0, this.r - n); break;
      case 'B': this.r = Math.min(ROWS - 1, this.r + n); break;
      case 'C': this.c = Math.min(COLS - 1, this.c + n); break;
      case 'D': this.c = Math.max(0, this.c - n); break;
      case 'G': this.c = Math.min(COLS - 1, n - 1); break;
      case 'H': this.r = Math.min(ROWS - 1, (p[0] || 1) - 1); this.c = Math.min(COLS - 1, (p[1] || 1) - 1); break;
      case 'h': case 'l':
        if (priv && p[0] === 25) this.cursor = final === 'h';
        // The alternate screen an editor draws on; leaving it restores the shell's screen and cursor.
        if (priv && p[0] === 1049 && final === 'h') {
          this.main = { grid: this.grid, r: this.r, c: this.c };
          this.grid = Array.from({ length: ROWS }, () => this.blankRow());
        }
        if (priv && p[0] === 1049 && final === 'l' && this.main) { Object.assign(this, this.main); this.main = null; }
        break;
    }
  }
  feed(text) {
    for (const ch of text) {
      if (this.mode === 'esc') {
        this.mode = ch === '[' ? 'csi' : ch === ']' ? 'osc' : 'text';
        this.params = '';
      } else if (this.mode === 'csi') {
        if (/[0-9;?]/.test(ch)) this.params += ch; else { this.csi(ch); this.mode = 'text'; }
      } else if (this.mode === 'osc') {
        if (ch === '\x07') this.mode = 'text'; else if (ch === '\x1b') this.mode = 'osc-esc';
      } else if (this.mode === 'osc-esc') {
        this.mode = 'text';
      } else if (ch === '\x1b') this.mode = 'esc';
      else if (ch === '\r') this.c = 0;
      else if (ch === '\n') this.newline();
      else if (ch === '\b') this.c = Math.max(0, this.c - 1);
      else if (ch === '\t') this.c = Math.min(COLS - 1, (Math.floor(this.c / 8) + 1) * 8);
      else if (ch >= ' ') this.put(ch);
    }
  }
  until(t) {
    if (this.next > 0 && events[this.next - 1][0] > t) this.reset();
    while (this.next < events.length && events[this.next][0] <= t) {
      const [at, , text] = events[this.next++];
      this.feed(text);
      if (text) this.lastOut = at;
    }
  }
}

// The close-up is a hard cut, `after` seconds past the moment its pattern first shows on screen, and holds `hold`.
function closeup(c) {
  const re = new RegExp(c.match), s = new Screen();
  for (const [t, , text] of events) {
    s.feed(text);
    for (let r = 0; r < ROWS; r++) {
      if (!re.test(s.text(r))) continue;
      const k = c.scale ?? 2, at = t + (c.after ?? 0.5);
      const row = CLOSE_ROW - k * (W.top + r * PITCH + PITCH / 2);
      const dx = Math.round(CLOSE_EDGE - k * W.x), dy = Math.round(Math.min(-k * (W.top - 10), Math.max(row, CLOSE_BOTTOM - k * (W.y + W.h))));
      return { at, end: at + (c.hold ?? 3), k, dx, dy };
    }
  }
  throw new Error(`the close-up pattern ${c.match} never appears in the cast`);
}

const camera = t => (close && t >= close.at ? [close.k, close.dx, close.dy] : [1, 0, 0]);

function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

const screen = new Screen();
let close = null;

window.prepare = async () => {};
window.renderFrame = t => {
  screen.until(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#faf8f4'; g.fillRect(0, 0, spec.width, spec.height);
  const [s, dx, dy] = camera(t);
  g.setTransform(s, 0, 0, s, dx, dy);
  g.save(); g.shadowColor = 'rgba(0,0,0,0.26)'; g.shadowBlur = 42 * s; g.shadowOffsetY = 16 * s;
  roundRect(W.x, W.y, W.w, W.h, 10); g.fillStyle = BG; g.fill(); g.restore();
  [[195, '#fb534e'], [224, '#fdb22b'], [254, '#25bf3a']].forEach(([x, col]) => {
    g.beginPath(); g.arc(x, 95, 9, 0, Math.PI * 2); g.fillStyle = col; g.fill();
  });
  const title = spec.title || '';
  g.font = `22px ${FONT}`; g.fillStyle = '#8a8a8a';
  g.fillText(title, Math.round(W.x + W.w / 2 - title.length * 7), 103);
  g.font = `${SIZE}px ${FONT}`;
  for (let r = 0; r < ROWS; r++) {
    const row = screen.grid[r], top = W.top + r * PITCH;
    for (let c = 0; c < COLS; c++) {
      const { ch, a } = row[c];
      let fg = a.fg || (a.dim ? DIM : FG), bg = a.bg;
      if (a.inverse) [fg, bg] = [bg || BG, fg];
      if (bg) { g.fillStyle = bg; g.fillRect(TX + c * ADV, top, ADV, PITCH); }
      if (ch === ' ') continue;
      g.fillStyle = fg;
      g.fillText(ch, TX + c * ADV, top + BASE);
      if (a.bold) g.fillText(ch, TX + c * ADV + 1 / s, top + BASE);
    }
  }
  if (screen.cursor && Math.floor((t - screen.lastOut) / 0.53) % 2 === 0) {
    const h = SIZE * 10 / 11;
    g.fillStyle = FG; g.globalAlpha = 0.8;
    g.fillRect(TX + Math.min(screen.c, COLS - 1) * ADV, W.top + screen.r * PITCH + (PITCH - h) / 2, ADV, h);
    g.globalAlpha = 1;
  }
};

(async () => {
  try {
    await Promise.all([document.fonts.load(`${SIZE}px ${FONT}`), document.fonts.load(`22px ${FONT}`)]);
    close = spec.closeup ? closeup(spec.closeup) : null;
    window.__total = close ? close.end : events.at(-1)[0];
    window.__ready = true;
  } catch (e) { window.__bootFailed = String(e); }
})();
</script>
