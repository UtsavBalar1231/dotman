<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#11111b}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// Replays an asciicast v2 recording onto a canvas, with the same prepare/renderFrame contract as
// huashu's clip.html so render.mjs drives both. Only the escape sequences dotman, git and bash
// print are interpreted: SGR, erase, cursor moves, cursor visibility; OSC strings are dropped.
const spec = window.CLIP_SPEC;
const lines = spec.cast.trim().split('\n');
const header = JSON.parse(lines[0]);
const events = lines.slice(1).map(l => JSON.parse(l)).filter(e => e[1] === 'o');
const COLS = header.width, ROWS = header.height;
const FONT = spec.font || '"FiraCode Nerd Font Mono", "DejaVu Sans Mono", monospace';
const SIZE = spec.fontSize || 26, LINE = Math.round(SIZE * 1.32), PAD = 28, BAR = 46;
const BG = '#1e1e2e', FG = '#cdd6f4';
const PALETTE = ['#45475a', '#f38ba8', '#a6e3a1', '#f9e2af', '#89b4fa', '#f5c2e7', '#94e2d5', '#bac2de',
  '#585b70', '#f38ba8', '#a6e3a1', '#f9e2af', '#89b4fa', '#f5c2e7', '#94e2d5', '#a6adc8'];

const canvas = document.getElementById('c');
canvas.width = spec.width; canvas.height = spec.height;
const g = canvas.getContext('2d');
window.__canvas = canvas;

function xterm256(n) {
  if (n < 16) return PALETTE[n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  n -= 16;
  const c = [Math.floor(n / 36), Math.floor(n / 6) % 6, n % 6].map(v => (v ? 55 + v * 40 : 0));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

class Screen {
  constructor() { this.reset(); }
  reset() {
    this.grid = Array.from({ length: ROWS }, () => this.blankRow());
    this.r = 0; this.c = 0; this.attr = {}; this.cursor = true;
    this.mode = 'text'; this.params = ''; this.next = 0;
  }
  blankRow() { return Array.from({ length: COLS }, () => ({ ch: ' ', a: {} })); }
  newline() {
    if (this.r === ROWS - 1) { this.grid.shift(); this.grid.push(this.blankRow()); } else this.r++;
  }
  put(ch) {
    if (this.c >= COLS) { this.c = 0; this.newline(); }
    this.grid[this.r][this.c] = { ch, a: this.attr };
    this.c++;
  }
  sgr(list) {
    const p = list.length ? list : [0];
    const a = { ...this.attr };
    for (let i = 0; i < p.length; i++) {
      const n = p[i];
      if (n === 0) { for (const k of Object.keys(a)) delete a[k]; }
      else if (n === 1) a.bold = true;
      else if (n === 2) a.dim = true;
      else if (n === 22) { a.bold = false; a.dim = false; }
      else if (n === 7) a.inverse = true;
      else if (n === 27) a.inverse = false;
      else if (n >= 30 && n <= 37) a.fg = PALETTE[n - 30];
      else if (n >= 90 && n <= 97) a.fg = PALETTE[n - 82];
      else if (n === 39) delete a.fg;
      else if (n >= 40 && n <= 47) a.bg = PALETTE[n - 40];
      else if (n === 49) delete a.bg;
      else if ((n === 38 || n === 48) && p[i + 1] === 5) { a[n === 38 ? 'fg' : 'bg'] = xterm256(p[i + 2]); i += 2; }
      else if ((n === 38 || n === 48) && p[i + 1] === 2) { a[n === 38 ? 'fg' : 'bg'] = `rgb(${p[i + 2]},${p[i + 3]},${p[i + 4]})`; i += 4; }
    }
    this.attr = a;
  }
  csi(final) {
    const priv = this.params.startsWith('?');
    const p = this.params.replace('?', '').split(';').filter(s => s !== '').map(Number);
    const n = p[0] || 1;
    switch (final) {
      case 'm': this.sgr(p); break;
      case 'K': {
        const row = this.grid[this.r], mode = p[0] || 0;
        const [from, to] = mode === 0 ? [this.c, COLS] : mode === 1 ? [0, this.c + 1] : [0, COLS];
        for (let i = from; i < Math.min(to, COLS); i++) row[i] = { ch: ' ', a: {} };
        break;
      }
      case 'J': if ((p[0] || 0) === 2) { this.grid = Array.from({ length: ROWS }, () => this.blankRow()); } break;
      case 'A': this.r = Math.max(0, this.r - n); break;
      case 'B': this.r = Math.min(ROWS - 1, this.r + n); break;
      case 'C': this.c = Math.min(COLS - 1, this.c + n); break;
      case 'D': this.c = Math.max(0, this.c - n); break;
      case 'G': this.c = Math.min(COLS - 1, n - 1); break;
      case 'H': this.r = Math.min(ROWS - 1, (p[0] || 1) - 1); this.c = Math.min(COLS - 1, (p[1] || 1) - 1); break;
      case 'h': case 'l': if (priv && p[0] === 25) this.cursor = final === 'h'; break;
    }
  }
  feed(text) {
    for (const ch of text) {
      if (this.mode === 'esc') {
        this.mode = ch === '[' ? 'csi' : ch === ']' ? 'osc' : 'text';
        this.params = '';
      } else if (this.mode === 'csi') {
        if (/[0-9;?]/.test(ch)) this.params += ch; else { this.csi(ch); this.mode = 'text'; }
      } else if (this.mode === 'osc') {
        if (ch === '\x07') this.mode = 'text'; else if (ch === '\x1b') this.mode = 'osc-esc';
      } else if (this.mode === 'osc-esc') {
        this.mode = 'text';
      } else if (ch === '\x1b') this.mode = 'esc';
      else if (ch === '\r') this.c = 0;
      else if (ch === '\n') this.newline();
      else if (ch === '\b') this.c = Math.max(0, this.c - 1);
      else if (ch === '\t') this.c = Math.min(COLS - 1, (Math.floor(this.c / 8) + 1) * 8);
      else if (ch >= ' ') this.put(ch);
    }
  }
  until(t) {
    if (this.next > 0 && events[this.next - 1][0] > t) this.reset();
    while (this.next < events.length && events[this.next][0] <= t) this.feed(events[this.next++][2]);
  }
}

const screen = new Screen();
let cw = 0;

function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

window.prepare = async () => {};
window.renderFrame = t => {
  screen.until(t);
  const W = COLS * cw + PAD * 2, H = ROWS * LINE + PAD * 2 + BAR;
  const x0 = Math.round((spec.width - W) / 2), y0 = Math.round((spec.height - H) / 2);
  g.fillStyle = '#11111b'; g.fillRect(0, 0, spec.width, spec.height);
  g.save(); g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 48; g.shadowOffsetY = 18;
  roundRect(x0, y0, W, H, 14); g.fillStyle = BG; g.fill(); g.restore();
  roundRect(x0, y0, W, BAR, 14); g.fillStyle = '#181825'; g.fill(); g.fillRect(x0, y0 + BAR - 14, W, 14);
  ['#f38ba8', '#f9e2af', '#a6e3a1'].forEach((col, i) => {
    g.beginPath(); g.arc(x0 + 26 + i * 24, y0 + BAR / 2, 7, 0, Math.PI * 2); g.fillStyle = col; g.fill();
  });
  g.font = `${Math.round(SIZE * 0.7)}px ${FONT}`; g.fillStyle = '#7f849c'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(spec.title || '', x0 + W / 2, y0 + BAR / 2);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  const tx = x0 + PAD, ty = y0 + BAR + PAD;
  for (let r = 0; r < ROWS; r++) {
    const row = screen.grid[r], base = ty + r * LINE;
    for (let c = 0; c < COLS; c++) {
      const { ch, a } = row[c];
      let fg = a.fg || FG, bg = a.bg;
      if (a.inverse) [fg, bg] = [bg || BG, fg];
      if (bg) { g.fillStyle = bg; g.fillRect(tx + c * cw, base, cw + 0.5, LINE); }
      if (ch === ' ') continue;
      g.font = `${a.bold ? 'bold ' : ''}${SIZE}px ${FONT}`;
      g.globalAlpha = a.dim ? 0.55 : 1;
      g.fillStyle = fg;
      g.fillText(ch, tx + c * cw, base + LINE * 0.76);
      g.globalAlpha = 1;
    }
  }
  if (screen.cursor && Math.floor(t / 0.53) % 2 === 0) {
    g.fillStyle = FG; g.globalAlpha = 0.8;
    g.fillRect(tx + Math.min(screen.c, COLS - 1) * cw, ty + screen.r * LINE + 3, cw, LINE - 6);
    g.globalAlpha = 1;
  }
};

(async () => {
  try {
    await document.fonts.load(`${SIZE}px ${FONT}`);
    g.font = `${SIZE}px ${FONT}`;
    cw = g.measureText('M').width;
    window.__ready = true;
  } catch (e) { window.__bootFailed = String(e); }
})();
</script>
