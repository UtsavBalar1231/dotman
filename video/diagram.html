<!doctype html>
<meta charset="utf-8">
<style>@font-face{font-family:"Departure Mono";src:url(fonts/departure-mono.woff) format("woff")}
html,body{margin:0;background:#faf8f4}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
// A flat diagram that builds one piece at a time, with the prepare/renderFrame contract render.mjs drives.
// SPEC: {"nodes": [{id, label, type, x, y, w, h?, at}], "groups": [{id, label, x, y, w, h, at}],
//        "edges": [{from, to, gap?, at}], "duration"}
// x and y are a box's top-left corner; `at` is when the piece starts to appear. Boxes and groups fade in over
// FADE; an edge draws from its source over DRAW, and its head appears when the shaft reaches it.
const spec = window.CLIP_SPEC;
const FONT = '"Departure Mono", monospace';
const FILL = { input: '#eeece4', step: '#b8d5f3', done: '#cee5b0', note: '#f8e0b8' };
const LINE = '#6b6b6b', ARROW = '#707070', LABEL = '#5e5e5e';
const BOX_H = 80, BAND = 80, GAP = 39, FADE = 0.5, DRAW = 0.9;

const canvas = document.getElementById('c');
canvas.width = spec.width; canvas.height = spec.height;
const g = canvas.getContext('2d');
window.__canvas = canvas;
window.__total = spec.duration;

const nodes = Object.fromEntries((spec.nodes || []).map(n => [n.id, { h: BOX_H, ...n }]));
const boxes = { ...Object.fromEntries((spec.groups || []).map(n => [n.id, n])), ...nodes };
const fade = at => t => Math.min(1, Math.max(0, (t - at) / FADE));

function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 22 px labels: caps are 16 px tall and each cell 14 px wide, so a whole-pixel centre keeps them on the grid.
function label(text, cx, cy) {
  g.font = `22px ${FONT}`; g.fillStyle = LABEL;
  g.fillText(text, Math.round(cx - text.length * 7), Math.round(cy + 8));
}

function box(x, y, w, h, r, fill) {
  roundRect(x, y, w, h, r); g.fillStyle = fill; g.fill();
  g.lineWidth = 2; g.strokeStyle = LINE; g.stroke();
}

function group(n) {
  roundRect(n.x, n.y, n.w, n.h, 14); g.fillStyle = '#fdfdfd'; g.fill();
  g.save(); g.clip(); g.fillStyle = FILL.input; g.fillRect(n.x, n.y, n.w, BAND); g.restore();
  roundRect(n.x, n.y, n.w, n.h, 14); g.lineWidth = 2; g.strokeStyle = LINE; g.stroke();
  g.beginPath(); g.moveTo(n.x, n.y + BAND); g.lineTo(n.x + n.w, n.y + BAND); g.stroke();
  label(n.label, n.x + n.w / 2, n.y + BAND / 2);
}

// Side by side, an edge runs from the source's right side to `gap` (default GAP) short of the target's left
// side, level with the shorter box's middle;
// otherwise from the source's top up to GAP short of the target's bottom.
function ends(e) {
  const a = boxes[e.from], b = boxes[e.to], gap = e.gap ?? GAP;
  if (a.y < b.y + b.h && b.y < a.y + a.h) {
    const row = a.h <= b.h ? a : b, y = Math.round(row.y + row.h / 2);
    return [a.x + a.w, y, b.x - gap, y];
  }
  const x = Math.round(a.x + a.w / 2);
  return [x, a.y, x, b.y + b.h + gap];
}

function edge(e, t) {
  const [x0, y0, x1, y1] = ends(e);
  const k = Math.min(1, Math.max(0, (t - e.at) / DRAW));
  if (k <= 0) return;
  g.lineWidth = 2; g.strokeStyle = ARROW;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + (x1 - x0) * k, y0 + (y1 - y0) * k); g.stroke();
  if (k === 1) {
    const ux = Math.sign(x1 - x0), uy = Math.sign(y1 - y0);
    g.beginPath();
    g.moveTo(x1 - 11 * ux - 10 * uy, y1 - 11 * uy - 10 * ux); g.lineTo(x1, y1); g.lineTo(x1 - 11 * ux + 10 * uy, y1 - 11 * uy + 10 * ux);
    g.stroke();
  }
}

window.prepare = async () => {};
window.renderFrame = t => {
  g.fillStyle = '#faf8f4'; g.fillRect(0, 0, spec.width, spec.height);
  for (const n of spec.groups || []) { g.globalAlpha = fade(n.at)(t); group(n); }
  for (const n of Object.values(nodes)) {
    g.globalAlpha = fade(n.at)(t);
    box(n.x, n.y, n.w, n.h, 10, FILL[n.type || 'step']);
    label(n.label, n.x + n.w / 2, n.y + n.h / 2);
  }
  g.globalAlpha = 1;
  for (const e of spec.edges || []) edge(e, t);
};

(async () => {
  try {
    await document.fonts.load(`22px ${FONT}`);
    window.__ready = true;
  } catch (e) { window.__bootFailed = String(e); }
})();
</script>
