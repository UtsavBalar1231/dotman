[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 2 is unmaintained, and only the legacy importer uses it; 2.0.1 is the newest release that builds, since 3.0.0 is a compile_error tombstone with no serde API" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
