name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: Advisories, licenses, bans and sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check

      - name: Generate license report
        run: |
          {
            echo "# Dependency Licenses"
            echo
            cargo deny list --format human
          } > license-report.md

      - name: Upload license report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: license-report
          path: license-report.md

  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.8.2

      - name: Generate the report
        run: |
          {
            echo "# Dependency Tree"
            echo
            echo "## Direct Dependencies"
            echo '```'
            cargo tree --depth=1
            echo '```'
            echo
            echo "## Full Dependency Tree"
            echo '```'
            cargo tree
            echo '```'
            echo
            echo "## Duplicate Dependencies"
            echo '```'
            cargo tree --duplicates
            echo '```'
            echo
            echo "## Unused Dependencies"
            echo '```'
            cargo machete || true
            echo '```'
          } > dependency-analysis.md

      - name: Upload dependency analysis
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dependency-analysis
          path: dependency-analysis.md

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [deny, dependency-analysis]
    if: always()
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Create security summary
        env:
          DENY: ${{ needs.deny.result }}
          ANALYSIS: ${{ needs.dependency-analysis.result }}
        run: |
          {
            echo "# Security Analysis Summary"
            echo
            echo "Generated on: $(date -u)"
            echo
            echo "- Dependency checks (cargo deny): $DENY"
            echo "- Dependency analysis: $ANALYSIS"
            echo
            echo "The license report and dependency analysis are attached to the run as artifacts."
          } > security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-summary
          path: security-summary.md

      - name: Comment PR with security summary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Security analysis results\n\n${summary}`
            });
