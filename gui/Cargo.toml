[package]
name = "dotman-gui"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace]

[patch.crates-io]
glib-macros = { path = "vendor/glib-macros" }
gtk3-macros = { path = "vendor/gtk3-macros" }

[dependencies]
tauri = { version = "=2.12.6", default-features = false, features = ["wry", "x11", "custom-protocol"] }
gtk = { version = "=0.18.2", default-features = false }
webkit2gtk = { version = "=2.0.2", default-features = false }
gdk = { version = "=0.18.2", default-features = false }
libc = { version = "=0.2.191", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[build-dependencies]
tauri-build = "=2.7.5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
