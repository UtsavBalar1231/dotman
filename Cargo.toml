[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "dotman-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Utsav Balar <utsavbalar1231@gmail.com>"]
description = "Dotfiles manager with git-like semantics"
# documentation = "https://docs.rs/dotman"
homepage = "https://github.com/UtsavBalar1231/dotman"
repository = "https://github.com/UtsavBalar1231/dotman"
license = "MIT"
readme = "README.md"
keywords = ["dotfiles", "configuration", "manager", "cli", "git"]
categories = ["command-line-utilities", "filesystem", "development-tools"]
include = [
    "src/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]
exclude = [
    "target/",
    "examples/",
    ".github/",
    "packaging/",
    "scripts/",
    "install/",
    "man/",
    "completions/",
    "dist/",
    "*.md",
    "!README.md",
]

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
anyhow = "1.0"
walkdir = "2.5"
bincode = { version = "2.0", features = ["serde"] }
zstd = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
colored = "3.1"
fs4 = "1.1"
tempfile = "3.27"
libc = "0.2"
glob = "0.3.4"
unicode-normalization = "0.1.26"
minijinja = "3.1.0"
serde_json = "1.0"
sha2 = "0.10"

shell-words = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
overflow-checks = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"

[profile.dist-debug]
inherits = "dist"
debug = true
strip = "none"

[lib]
name = "dotman"
path = "src/lib.rs"

[[bin]]
name = "dotman"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
